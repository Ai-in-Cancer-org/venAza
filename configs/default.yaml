# =============================================================================
# venAza — default configuration
#
# All paths are placeholders. Copy this file (e.g. configs/my_run.yaml), edit the
# `paths` block, and pass it to every script with `--config configs/my_run.yaml`.
# Any value can also be overridden on the command line with
#   --set section.key=value     (e.g. --set resnet_mil.epochs=10)
# =============================================================================

paths:
  # Input: one sub-directory per patient, each holding the manually selected
  # ROI images (png / jpg / tif) exported from the whole-slide images.
  roi_dir:            data/rois
  # Clinical / genetic table (one row per patient, see data/README.md).
  clinical_table:     data/clinical.csv
  # Everything produced by the pipeline is written below `work_dir`.
  work_dir:           outputs
  # Hugging Face cache for the pathology foundation models (CONCH / UNI).
  hf_cache_dir:       outputs/model_cache

  # --- external validation cohort (optional) ---
  external_roi_dir:        data/external/rois
  external_clinical_table: data/external/clinical.csv

# -----------------------------------------------------------------------------
# Clinical table: column names in YOUR file -> canonical names used by the code
# -----------------------------------------------------------------------------
clinical:
  columns:
    patient_id: patient_id
    response:   best_response      # free text: CR, CRi, PR, refractory, ...
    eln2024:    eln2024_li         # favorable / intermediate / adverse
    swog:       swog_cyto          # favorable / intermediate / unfavorable / unknown
    age:        age_at_diagnosis   # years
    blasts:     bm_blasts          # percent (0-100) or fraction (0-1)
    sex:        sex                # optional, only used for descriptive statistics
  # binary mutation columns (Y/N, 1/0, yes/no, true/false)
  mutations:
    NPM1:     NPM1
    IDH1_2:   IDH1_2
    TP53:     TP53
    ASXL1:    ASXL1
    RAS:      RAS
    PTPN11:   PTPN11
    RUNX1:    RUNX1
    FLT3_ITD: FLT3_ITD
  # Response definition (ELN 2022): CR / CRi = responder (1), anything less = 0
  responder_labels:     [cr, cri, "cr i", "cr/cri"]
  non_responder_labels: [pr, refractory, resistant, nr, "no response", sd,
                         "stable disease", pd, "progressive disease", failure]
  # Continuous features are scaled to [0, 1] by dividing by this constant.
  age_scale: 100.0

# -----------------------------------------------------------------------------
# 1) Patch extraction + region-adaptive quality control
# -----------------------------------------------------------------------------
patch_extraction:
  patch_size: 358            # non-overlapping, non-padded square patches
  max_border_crop: 50        # max pixels discarded per dimension when cropping
                             # the ROI to an integer multiple of patch_size
  sat_k: 0.5                 # saturation threshold  = mean_S + sat_k * std_S
  lum_k: 0.2                 # luminance threshold   = mean_L + lum_k * std_L
  min_foreground: 0.16       # min fraction of foreground pixels to keep a patch
  save_rejected: true        # also write rejected patches (for QC figures)
  save_grid_figure: true     # K/R overview figure per ROI
  image_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff"]

# -----------------------------------------------------------------------------
# 2) Cross-validation splits (shared by every branch -> identical data split)
# -----------------------------------------------------------------------------
splits:
  n_folds: 5
  inner_val_frac: 0.2        # inner validation split taken from the training folds
                             # (early stopping / checkpoint selection only)
  seeds: [42, 123, 456]      # independent repetitions (init, sampling, fold shuffle)

# -----------------------------------------------------------------------------
# 3) Custom CNN branch: end-to-end ResNet-34 gated-attention MIL
# -----------------------------------------------------------------------------
resnet_mil:
  backbone: resnet34
  pretrained: true           # ImageNet initialisation
  input_size: [224, 224]
  attn_dim: 256
  attn_dropout: 0.25
  attn_temperature: 1.5
  epochs: 70
  lr: 1.7473388632188635e-05
  weight_decay: 3.3683273143216377e-04
  warmup_frozen_epochs: 2    # encoder frozen for the first epochs
  plateau_factor: 0.5        # ReduceLROnPlateau on validation AUROC
  plateau_patience: 4
  early_stop_patience: 10
  early_stop_min_delta: 1.0e-4
  grad_clip: 5.0
  use_amp: true              # mixed precision (CUDA only)
  chunk_size: 8              # encoder forward chunk size inside one bag
  max_train_tiles: null      # null = every QC-passed patch enters the softmax;
                             # set an integer to sub-sample bags if GPU memory is tight
  num_workers: 4

# -----------------------------------------------------------------------------
# 4) Foundation-model branch
# -----------------------------------------------------------------------------
foundation:
  encoders:
    conch:
      hf_id: hf_hub:MahmoodLab/CONCH
      arch: conch_ViT-B-16
      feat_dim: 512
      trainable_blocks: [10, 11]
    uni:
      hf_id: hf-hub:MahmoodLab/uni
      feat_dim: 1024
      trainable_blocks: [22, 23]
  tile_size: 224
  extract_batch_size: 64

dino:
  epochs: 200
  lr: 5.0e-05
  weight_decay: 0.04
  min_lr: 1.0e-06
  out_dim: 65536
  hidden_dim: 2048
  bottleneck_dim: 256
  student_temp: 0.1
  teacher_temp: 0.07
  warmup_teacher_temp: 0.04
  warmup_teacher_temp_epochs: 20
  center_momentum: 0.9
  ema_momentum_base: 0.996
  grad_clip: 3.0
  batch_size:            # per GPU
    conch: 128
    uni: 64
  num_workers: 8
  save_every: 10

fm_mil:
  feature_set: combined     # conch | uni | combined (concatenation of both)
  proj_dim: 512
  attn_dim: 128
  dropout: 0.6
  epochs: 100
  patience: 10
  lr: 1.0e-05
  weight_decay: 5.0e-03
  min_lr: 1.0e-06
  label_smoothing: 0.1
  focal_gamma: 2.0
  grad_clip: 0.5
  feature_noise_std: 0.01   # bag-level augmentation (tile shuffling + noise)

# -----------------------------------------------------------------------------
# 5) Late multimodal fusion (second stage)
# -----------------------------------------------------------------------------
fusion:
  heads: [lr, elasticnet, rf, xgb]
  random_state: 42
  lr:         {C: 0.1, max_iter: 1000}
  elasticnet: {C: 0.1, l1_ratio: 0.5, max_iter: 2000}
  rf:         {n_estimators: 500, max_depth: 4}
  xgb:        {n_estimators: 200, max_depth: 3, learning_rate: 0.05,
               subsample: 0.8, colsample_bytree: 0.8, scale_pos_weight: 4.0}

# -----------------------------------------------------------------------------
# 6) Evaluation
# -----------------------------------------------------------------------------
evaluation:
  n_bootstrap: 2000
  ci_level: 0.95
  ci_method: bootstrap       # bootstrap | wilson (wilson applies to proportion metrics)
  bootstrap_seed: 0

# -----------------------------------------------------------------------------
# 7) Explainability
# -----------------------------------------------------------------------------
explainability:
  shap_head: lr
  shap_perturbation: correlation_dependent
  rollout_head_fusion: mean  # mean | max | min over attention heads
  rollout_top_tiles: 16      # tiles shown per patient (highest MIL attention)
  rollout_alpha: 0.5

# -----------------------------------------------------------------------------
# 8) External validation
# -----------------------------------------------------------------------------
external:
  rescale_factor: 1.0            # optional ROI rescaling to match the training pixel
                                 # spacing: external_um_per_px / training_um_per_px
                                 # (values < 1 down-sample); 1.0 = no rescaling
  heads: [lr, elasticnet, rf, xgb]
